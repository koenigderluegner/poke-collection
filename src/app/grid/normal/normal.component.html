@let poke = pokemon();

<div class="icon-wrapper">
  <img [src]="'assets/images/pokesprite-pokeball.svg'" alt="" class="icon-foundation">
  <div class="icon">
    <app-pokemon [shiny]="!!poke?.isShiny" [slug]="$safeNavigationMigration(poke?.iconSlug)"/>
    @if (poke?.item) {
      <app-item [slug]="$safeNavigationMigration(poke?.item) | slugify"/>
    }
    @if (poke?.ball) {
      <app-item [slug]="$safeNavigationMigration(poke?.ball) | slugify" category="ball"/>
    }
  </div>
</div>
<div class="information">
  <div>{{ poke?.name }}</div>
  <div>{{ poke?.ability }}</div>
</div>
<div class="shiny-icon">
  @if (poke?.isShiny) {
    <mat-icon svgIcon="shiny-stars"/>
  }
</div>
